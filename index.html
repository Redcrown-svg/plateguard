const PLATE_RE=/^[A-Z]{3}-?\d[A-Z0-9]\d{2}$/;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=LS.get("pg.lang","pt"), uf=LS.get("pg.uf","SP"), recent=LS.get("pg.recent2",[]);
if(!I18N[lang])lang="pt"; if(!DETRAN[uf])uf="SP";
const T=k=>I18N[lang][k]; const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const normPlate=s=>s.normalize("NFKC").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,8);
const plateKey=s=>normPlate(s).replace(/-/g,"");
const ext='<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';
const short=u=>u.replace(/^https:\/\/(www\.)?/,"").replace(/\/$/,"");
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T(el.dataset.i)});
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  $("h1").innerHTML=T("h1");
  $("uf").innerHTML=UFS.map(([c,n])=>`<option value="${c}">${c} — ${esc(n)}</option>`).join(""); $("uf").value=uf;
  update(); renderOfficial(); renderChips();
}
function update(){
  const v=normPlate($("plate").value); const bad=v&&!PLATE_RE.test(v);
  $("platehint").className="hint"+(bad?" warn":""); $("plate").classList.toggle("warn",!!bad);
  $("platehint").textContent=bad?T("fmtBad"):T("fmtOk");
  $("pnum").textContent=v||"ABC1D23"; $("pnum").classList.toggle("ph",!v); $("pufl").textContent=uf;
  $("golbl").textContent=T("go").replace("{uf}",uf);
  $("goHint2").textContent=lookupLogin(uf)?T("goHintLogin"):T("goHintForm");
}
function renderOfficial(){
  $("official").innerHTML=`<div class="k"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>${esc(T("official"))}</div>
    <a href="${CDT_URL}" target="_blank" rel="noopener"><span>${esc(T("cdt"))}<span class="d">${esc(T("cdtD"))}</span></span>${ext}</a>
    <a href="${SENATRAN_URL}" target="_blank" rel="noopener"><span>${esc(T("senatran"))}<span class="d">${esc(T("senatranD"))}</span></span>${ext}</a>
    <a href="${lookupUrl(uf)}" target="_blank" rel="noopener"><span>DETRAN-${uf}<span class="d">${short(lookupUrl(uf))}</span></span>${ext}</a>`;
}
function renderChips(){
  $("chips").innerHTML=recent.length?recent.map((r,i)=>`<button type="button" class="chip" data-i2="${i}"><span class="cc">${r.uf}</span>${esc(r.plate)}<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/></svg></button>`).join(""):`<span class="empty">${esc(T("norecent"))}</span>`;
}
function go(){
  const plate=normPlate($("plate").value); if(!plate)return;
  recent=[{uf,plate},...recent.filter(r=>!(r.uf===uf&&plateKey(r.plate)===plateKey(plate)))].slice(0,12); LS.set("pg.recent2",recent); renderChips();
  const u=lookupUrl(uf);const w=window.open(u,"_blank","noopener"); if(!w)location.href=u;
}
$("form").addEventListener("submit",e=>{e.preventDefault();go()});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const r=recent[+b.dataset.i2];uf=r.uf;LS.set("pg.uf",uf);$("uf").value=uf;$("plate").value=r.plate;update();renderOfficial();go()});
$("clear").addEventListener("click",()=>{recent=[];LS.set("pg.recent2",recent);renderChips()});
$("uf").addEventListener("change",e=>{uf=e.target.value;LS.set("pg.uf",uf);update();renderOfficial()});
$("plate").addEventListener("input",update);
$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;LS.set("pg.lang",lang);applyLang()});
const tick=()=>{$("clock").textContent=new Date().toISOString().slice(11,19)+" UTC"};tick();setInterval(tick,1000);
applyLang();
</script>

<script data-goatcounter="https://plateguard.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>

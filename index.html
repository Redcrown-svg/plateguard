:root{

.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 16px var(--mono)}
.brand b{display:block;font-weight:800;line-height:1.1}.brand span{font-size:12px;color:var(--muted)}
.hd .sp{flex:1}
.clock{font:12px var(--mono);color:var(--muted)}
.langs{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}

.links .k svg{width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:2}
.links a{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:15px;gap:10px;border-top:1px solid var(--line)}
.links a:first-of-type{border-top:0}
.links a svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.links .d{display:block;font-size:13px;color:var(--muted);font-weight:400}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.clear{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}.clear:hover{color:var(--fg)}
.empty{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;font:600 13px var(--mono);direction:ltr}

.rjbanner.bad{background:rgba(255,93,93,.08);border-color:rgba(255,93,93,.4)}
.rjbanner.err{background:rgba(245,180,0,.09);border-color:rgba(245,180,0,.4)}
.rjbanner b{display:block;font-size:16px;margin-bottom:2px}.rjbanner p{margin:0;color:var(--muted);font-size:13.5px}
.rjbanner .ic{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid;display:grid;place-items:center}
.rjbanner.ok .ic{border-color:var(--ok);color:var(--ok)}.rjbanner.bad .ic{border-color:#ff5d5d;color:#ff5d5d}.rjbanner.err .ic{border-color:var(--warn);color:var(--warn)}

.mrow:first-child{border-top:0}

.mrow .amt{font:700 16px var(--mono);text-align:end}
.mrow a{font-size:13px}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);padding-block:22px 34px;font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.1em;color:var(--ok);border:1px solid var(--ok-line);border-radius:6px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const ext='<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';
const short=u=>u.replace(/^https:\/\/(www\.)?/,"").replace(/\/$/,"");
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T(el.dataset.i)});
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));

function update(){
  const v=normPlate($("plate").value); const bad=v&&!PLATE_RE.test(v);

  $("platehint").textContent=bad?T("fmtBad"):T("fmtOk");
  $("pnum").textContent=v||"ABC1D23"; $("pnum").classList.toggle("ph",!v); $("pufl").textContent=uf;

const LOCALE={pt:"pt-BR",fr:"fr-FR",en:"en-GB",ar:"ar-AE"};
const fmtBRL=v=>{try{return new Intl.NumberFormat(LOCALE[lang],{style:"currency",currency:"BRL"}).format(v)}catch(e){return "R$ "+Number(v).toFixed(2)}};
const dateBR=s=>{if(!s)return"";const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/)||String(s).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return s;const d=m[0].includes("/")?new Date(m[3],m[2]-1,m[1]):new Date(m[1],m[2]-1,m[3]);try{return new Intl.DateTimeFormat(LOCALE[lang],{dateStyle:"medium"}).format(d)}catch(e){return s}};
const toNum=v=>typeof v==="number"?v:(parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3})/g,"").replace(",","."))||0);
function renderOfficial(){
  $("official").innerHTML=`<div class="k"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>${esc(T("official"))}</div>
    <a href="${CDT_URL}" target="_blank" rel="noopener"><span>${esc(T("cdt"))}<span class="d">${esc(T("cdtD"))}</span></span>${ext}</a>
    <a href="${SENATRAN_URL}" target="_blank" rel="noopener"><span>${esc(T("senatran"))}<span class="d">${esc(T("senatranD"))}</span></span>${ext}</a>
    <a href="${lookupUrl(uf)}" target="_blank" rel="noopener"><span>DETRAN-${uf}<span class="d">${short(lookupUrl(uf))}</span></span>${ext}</a>`;
}
function renderChips(){
  $("chips").innerHTML=recent.length?recent.map((r,i)=>`<button type="button" class="chip" data-i2="${i}"><span class="cc">${r.uf}</span>${esc(r.plate)}<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/></svg></button>`).join(""):`<span class="empty">${esc(T("norecent"))}</span>`;
}
function go(){
  const plate=normPlate($("plate").value); if(!plate)return;
  recent=[{uf,plate},...recent.filter(r=>!(r.uf===uf&&plateKey(r.plate)===plateKey(plate)))].slice(0,12); LS.set("pg.recent2",recent); renderChips();
  const u=lookupUrl(uf);const w=window.open(u,"_blank","noopener"); if(!w)location.href=u;
}
$("form").addEventListener("submit",e=>{e.preventDefault();go()});

$("clear").addEventListener("click",()=>{recent=[];LS.set("pg.recent2",recent);renderChips()});
$("uf").addEventListener("change",e=>{uf=e.target.value;LS.set("pg.uf",uf);update();renderOfficial()});
$("plate").addEventListener("input",update);
// ---------- Onglets public / garage ----------
/* Garage : États consultables en direct via Infosimples. GREQ[uf] = champs requis. */
/* RJ only pour l'instant. Les autres États restent dans GREQ (réactivation facile :
   remettre leur ligne dans SUPPORTED). */
const SUPPORTED=[["RJ","Rio de Janeiro"]];
const GREQ={AC:["cpf"],AL:["placa","renavam"],AM:["placa","renavam"],AP:["placa","renavam"],BA:["cpf"],CE:["placa","renavam"],DF:["placa","renavam"],ES:["cpf"],GO:["placa","renavam"],MA:["placa","renavam"],MG:["placa","renavam"],MS:["placa","renavam"],MT:["placa","renavam"],PA:["placa","renavam"],PB:["placa","renavam"],PE:["cpf"],PI:["placa","renavam"],PR:["renavam"],RJ:["renavam"],RN:["cpf"],RO:["placa","renavam"],RR:["placa","renavam"],RS:["placa","renavam"],SC:["placa","renavam"],SP:["cpf"],TO:["placa","renavam"],PRF:["placa","renavam"]};
const greq=u=>GREQ[u]||["placa","renavam"];
function setView(v){
  $("view-public").hidden=v!=="public"; $("view-garage").hidden=v!=="garage";
  document.querySelectorAll("#tabs2 button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  if(v==="garage")showGarageOrGate();
  try{history.replaceState(null,"","#"+v)}catch(e){}
}
$("tabs2").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.v)});

// ---------- Garage ----------
let acode=""; try{acode=localStorage.getItem("pg.acode")||""}catch(e){}
let garage=LS.get("pg.garage",[]);
const results={}; // id -> {count,total} du dernier contrôle
const guid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function showGarageOrGate(){
  const ok=!!acode;
  $("gate").hidden=ok; $("garage").hidden=!ok;
  if(ok){fillGarageUf();renderFleet()}
}
function fillGarageUf(){
  const cur=$("g-uf").value||"RJ";
  $("g-uf").innerHTML=SUPPORTED.map(([c,n])=>`<option value="${c}">${c} — ${esc(n)}</option>`).join("");
  $("g-uf").value=cur; toggleCpf();
}
function toggleCpf(){
  const u=$("g-uf").value, req=greq(u);
  $("g-cpf-field").style.display=(req.includes("cpf")||u==="RJ")?"":"none"; // RJ : CPF facultatif mais utile
  $("gSupHint").textContent=T("gReq")+" : "+req.map(p=>p.toUpperCase()).join(" + ");
}
$("g-uf").addEventListener("change",toggleCpf);
$("g-renavam").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,11)});
const fmtCpf=v=>{const d=v.replace(/\D/g,"").slice(0,11);
  if(d.length>9)return d.slice(0,3)+"."+d.slice(3,6)+"."+d.slice(6,9)+"-"+d.slice(9);
  if(d.length>6)return d.slice(0,3)+"."+d.slice(3,6)+"."+d.slice(6);
  if(d.length>3)return d.slice(0,3)+"."+d.slice(3);
  return d;};
$("g-cpf").addEventListener("input",e=>{e.target.value=fmtCpf(e.target.value)});
$("gateform").addEventListener("submit",e=>{e.preventDefault();const c=$("gate-code").value.trim();if(!c)return;acode=c;try{localStorage.setItem("pg.acode",c)}catch(x){}$("gate-code").value="";$("gateerr").textContent="";showGarageOrGate()});
$("glogout").addEventListener("click",()=>{acode="";try{localStorage.removeItem("pg.acode")}catch(x){}showGarageOrGate()});
$("gform").addEventListener("submit",e=>{
  e.preventDefault();
  const uf=$("g-uf").value, plate=normPlate($("g-plate").value), renavam=$("g-renavam").value.replace(/\D/g,""), cpf=$("g-cpf").value.replace(/\D/g,""), nick=$("g-nick").value.trim();
  const req=greq(uf), have={placa:plate.length>=6,renavam:renavam.length>=9,cpf:cpf.length===11};
  if(!req.every(p=>have[p])){ $("gSupHint").textContent=T("gReq")+" : "+req.map(p=>p.toUpperCase()).join(" + "); $("gSupHint").className="hint warn"; return; }
  $("gSupHint").className="hint";
  garage.push({id:guid(),uf,plate,renavam,cpf,nick}); LS.set("pg.garage",garage);
  $("g-plate").value="";$("g-renavam").value="";$("g-cpf").value="";$("g-nick").value="";
  renderFleet();
});
function renderFleet(){
  if(!garage.length){$("glist").innerHTML=`<div class="empty" style="padding:8px">${esc(T("gEmpty"))}</div>`;renderSummary();return}
  $("glist").innerHTML=garage.map(v=>`<div class="gcard" data-id="${v.id}">
    <div class="gh">
      <div class="gt"><b>${esc(v.nick||v.plate||v.uf)}</b>
        <div class="m"><span class="flag">${v.uf}</span>${v.plate?`<span>${esc(v.plate)}</span>`:""}${v.renavam?`<span>RENAVAM ${esc(v.renavam)}</span>`:""}</div>
      </div>
      <div class="actions"><button class="ib" data-act="check">${esc(T("gEnter")==="دخول"?"فحص":"✓")}</button><button class="ib" data-act="del">✕</button></div>
    </div>
    <div class="gr" id="gr-${v.id}"></div>
  </div>`).join("");
  renderSummary();
}
$("glist").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const id=b.closest(".gcard").dataset.id; const v=garage.find(x=>x.id===id); if(!v)return;
  if(b.dataset.act==="del"){ garage=garage.filter(x=>x.id!==id); delete results[id]; LS.set("pg.garage",garage); renderFleet(); renderSummary(); }
  else checkVehicle(v);
});
$("gcheckall").addEventListener("click",async()=>{
  if(!garage.length)return;
  const btn=$("gcheckall"); btn.disabled=true;
  const q=[...garage], pool=Math.min(5,q.length);
  const work=async()=>{ while(q.length){ await checkVehicle(q.shift()); } };
  try{ await Promise.all(Array.from({length:pool},work)); } finally{ btn.disabled=false; }
});
function renderSummary(){
  const live=new Set(garage.map(v=>v.id));
  const ids=Object.keys(results).filter(id=>live.has(id));
  const el=$("gsum"); if(!el)return;
  if(!ids.length){ el.hidden=true; return; }
  let c=0,t=0; for(const id of ids){ c+=results[id].count||0; t+=results[id].total||0; }
  el.hidden=false; el.className="gsum "+(c>0?"bad":"ok");
  el.innerHTML=`<span>${esc(T("gSumLabel"))} · ${c>0?esc(T("gSomeV").replace("{n}",c)):esc(T("gNoneV"))}</span><span class="tot">${fmtBRL(t)}</span>`;
}
// ---- Import par photo (OCR navigateur, Tesseract chargé à la demande) ----
let _tess=null;
function loadTess(){ if(_tess)return _tess; _tess=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);}); return _tess; }
function ocrLineToRow(raw,uf){
  const line=raw.trim(); if(!line)return "";
  const up=line.toUpperCase();
  const pm=up.match(/[A-Z]{3}[-\s]?\d[A-Z0-9]\d{2}/)||up.match(/[A-Z]{3}\s?\d{4}/);
  const plate=pm?pm[0].replace(/[^A-Z0-9]/g,""):"";
  const cpfM=line.match(/\d{3}\.\d{3}\.\d{3}-?\d{2}/); // CPF = seulement si ponctué, pour ne pas confondre avec un RENAVAM nu
  let cpf=cpfM?cpfM[0].replace(/\D/g,""):""; if(cpf.length!==11)cpf="";
  let rest=up; if(cpf){rest=rest.replace(cpfM[0]," ");} if(pm){rest=rest.replace(pm[0]," ");}
  const groups=(rest.match(/\d[\d.\-\s]{7,}\d/g)||[]).map(x=>x.replace(/\D/g,"")).filter(n=>n.length>=9&&n.length<=11&&n!==cpf&&n!==plate);
  const ren=groups[0]||"";
  if(!plate&&!ren&&!cpf)return line; // rien reconnu → ligne brute à corriger
  return [uf,plate,ren,cpf].join("; ").replace(/(;\s*)+$/,"");
}
$("g-ocr").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f)return;
  const msg=$("gOcrMsg"); msg.className="hint"; msg.textContent=T("gOcrReading");
  try{
    await loadTess();
    const {data:{text}}=await window.Tesseract.recognize(f,"eng");
    const uf=$("g-uf").value;
    const rows=text.split(/\r?\n/).map(l=>ocrLineToRow(l,uf)).filter(Boolean);
    const ta=$("g-bulk"); ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+rows.join("\n");
    msg.className="hint warn"; msg.textContent=T("gOcrDone");
  }catch(err){ msg.className="hint warn"; msg.textContent=T("gOcrErr"); }
});
$("gbulkadd").addEventListener("click",()=>{
  const lines=$("g-bulk").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  let added=0,skip=0;
  for(const line of lines){
    const p=line.split(/[;,\t]+/).map(s=>s.trim());
    const uf=(p[0]||"").toUpperCase();
    if(!GREQ[uf]){ skip++; continue; }
    const plate=normPlate(p[1]||""), renavam=(p[2]||"").replace(/\D/g,""), cpf=(p[3]||"").replace(/\D/g,""), nick=(p[4]||"");
    const req=greq(uf), have={placa:plate.length>=6,renavam:renavam.length>=9,cpf:cpf.length===11};
    if(!req.every(x=>have[x])){ skip++; continue; }
    garage.push({id:guid(),uf,plate,renavam,cpf,nick}); added++;
  }
  if(added){ LS.set("pg.garage",garage); renderFleet(); }
  $("g-bulk").value="";
  const msg=$("gBulkMsg"); msg.textContent=T("gBulkDone").replace("{a}",added).replace("{i}",skip);
  msg.className="hint"+(skip&&!added?" warn":"");
});
async function checkVehicle(v){
  const cell=$("gr-"+v.id); if(!cell)return;
  cell.innerHTML=`<span class="spin"></span> ${esc(T("gChecking"))}`;
  try{
    const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Access-Code":acode},body:JSON.stringify({uf:v.uf,placa:v.plate,renavam:v.renavam,cpf:v.cpf})});
    if(r.status===401){ acode=""; try{localStorage.removeItem("pg.acode")}catch(x){} showGarageOrGate(); return; }
    const j=await r.json();
    if(!j||j.ok!==true){ const d=j?[j.error,j.detail||j.code_message,j.code].filter(Boolean).join(" · "):""; cell.innerHTML=`<span class="st err">${esc(T("gErrV"))}</span>${d?` <span class="m" style="display:block;margin-top:4px">(${esc(d)})</span>`:""}`; delete results[v.id]; renderSummary(); return; }
    if(j.count===0){ cell.innerHTML=`<span class="st ok">${esc(T("gNoneV"))}</span>`; results[v.id]={count:0,total:0}; renderSummary(); return; }
    let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="st bad">${esc(T("gSomeV").replace("{n}",j.count))}</span><span class="mono" style="font-weight:700;color:#ff5d5d">${fmtBRL(j.total||0)}</span></div>`;
    for(const m of j.multas){
      h+=`<div class="mrow"><div><b>${m.ait?("AIT "+esc(m.ait)):(m.descricao?esc(m.descricao):"—")}</b><div class="m">`+
         (m.data_infracao?`<span>${esc(T("thDate"))}: ${dateBR(m.data_infracao)}</span>`:"")+
         (m.vencimento?`<span>${esc(T("thDue"))}: ${dateBR(m.vencimento)}</span>`:"")+
         (m.boleto_url?`<a href="${esc(m.boleto_url)}" target="_blank" rel="noopener">${esc(T("boleto"))} ↗</a>`:"")+
         `</div></div><div class="amt">${fmtBRL(m.valor||0)}</div></div>`;
    }
    cell.innerHTML=h;
    results[v.id]={count:j.count,total:j.total||0}; renderSummary();
  }catch(err){ cell.innerHTML=`<span class="st err">${esc(T("gErrV"))}</span>`; delete results[v.id]; renderSummary(); }
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;LS.set("pg.lang",lang);applyLang();if(!$("view-garage").hidden)showGarageOrGate()});
const tick=()=>{$("clock").textContent=new Date().toISOString().slice(11,19)+" UTC"};tick();setInterval(tick,1000);
applyLang();
// Site RJ only : on masque les onglets et on ouvre directement le garage.
$("tabs2").style.display="none"; setView("garage");
</script>
